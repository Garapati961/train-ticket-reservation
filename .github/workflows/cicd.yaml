name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Check WAR file
        run: ls -lh target/*.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war


  # =========================
  # DEPLOY TO DEV
  # =========================
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: ./artifact

      - name: Check downloaded WAR
        run: ls -lh ./artifact/*.war

      - name: Deploy to Tomcat DEV
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

        run: |
          set -e

          WAR_FILE=$(find ./artifact -name "*.war" -type f | head -n 1)

          echo "WAR file: $WAR_FILE"
          echo "Tomcat URL: $TOMCAT_URL"

          curl --fail --show-error --silent \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-reservation&update=true"

          echo "Deployment successful!"
