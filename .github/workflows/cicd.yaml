name: Train-Ticket-Reservation Multi-Environment CI/CD

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:

  # ==========================================================
  # BUILD AND TEST
  # ==========================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: |
          set -e
          mvn -B clean package

      - name: Find WAR
        run: |
          set -e

          echo "Checking generated WAR..."

          WAR=$(find target -maxdepth 1 -type f -name "*.war" | head -n 1)

          if [ -z "$WAR" ]; then
            echo "ERROR: WAR file not found!"
            ls -la target/
            exit 1
          fi

          echo "WAR found: $WAR"

          mkdir -p artifact

          cp "$WAR" artifact/train-ticket-reservation.war

          ls -lh artifact/train-ticket-reservation.war

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: artifact/train-ticket-reservation.war
          retention-days: 7


  # ==========================================================
  # DEV
  # ==========================================================
  deploy-dev:
    name: Deploy → DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to DEV
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          SSHPASS: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e

          echo "========================================="
          echo "Deploying to DEV"
          echo "========================================="

          echo "Copying WAR to Tomcat server..."

          sshpass -e scp \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            artifact/train-ticket-reservation.war \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/train-ticket-reservation.war"

          echo "WAR copied successfully."

          echo "Deploying WAR to Tomcat..."

          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            'bash -s' <<'EOF'

          set -e

          echo "Stopping Tomcat..."

          sudo systemctl stop tomcat10

          echo "Removing old application..."

          sudo rm -rf /var/lib/tomcat10/webapps/train-ticket-reservation
          sudo rm -f /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Copying new WAR..."

          sudo cp \
            /tmp/train-ticket-reservation.war \
            /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Starting Tomcat..."

          sudo systemctl start tomcat10

          echo "Waiting for application..."

          for i in {1..12}
          do
            if curl -fsS \
              http://localhost:8080/train-ticket-reservation/ \
              > /dev/null
            then
              echo "DEV deployment successful."
              exit 0
            fi

            echo "Waiting for application... $i/12"
            sleep 5
          done

          echo "DEV deployment failed."

          sudo systemctl status tomcat10 --no-pager || true

          exit 1

          EOF


  # ==========================================================
  # TEST
  # ==========================================================
  deploy-test:
    name: Deploy → TEST
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: test

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to TEST
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          SSHPASS: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e

          echo "========================================="
          echo "Deploying to TEST"
          echo "========================================="

          sshpass -e scp \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            artifact/train-ticket-reservation.war \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/train-ticket-reservation.war"

          echo "WAR copied successfully."

          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            'bash -s' <<'EOF'

          set -e

          echo "Stopping Tomcat..."

          sudo systemctl stop tomcat10

          echo "Removing old application..."

          sudo rm -rf /var/lib/tomcat10/webapps/train-ticket-reservation
          sudo rm -f /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Installing new WAR..."

          sudo cp \
            /tmp/train-ticket-reservation.war \
            /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Starting Tomcat..."

          sudo systemctl start tomcat10

          echo "Waiting for application..."

          for i in {1..12}
          do
            if curl -fsS \
              http://localhost:8080/train-ticket-reservation/ \
              > /dev/null
            then
              echo "TEST deployment successful."
              exit 0
            fi

            echo "Waiting for application... $i/12"
            sleep 5
          done

          echo "TEST deployment failed."

          sudo systemctl status tomcat10 --no-pager || true

          exit 1

          EOF


  # ==========================================================
  # PRE-PRODUCTION
  # ==========================================================
  deploy-preprod:
    name: Deploy → PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest

    environment:
      name: pre-production

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to PRE-PROD
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          SSHPASS: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e

          echo "========================================="
          echo "Deploying to PRE-PROD"
          echo "========================================="

          sshpass -e scp \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            artifact/train-ticket-reservation.war \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/train-ticket-reservation.war"

          echo "WAR copied successfully."

          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            'bash -s' <<'EOF'

          set -e

          echo "Stopping Tomcat..."

          sudo systemctl stop tomcat10

          echo "Removing old application..."

          sudo rm -rf /var/lib/tomcat10/webapps/train-ticket-reservation
          sudo rm -f /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Installing new WAR..."

          sudo cp \
            /tmp/train-ticket-reservation.war \
            /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Starting Tomcat..."

          sudo systemctl start tomcat10

          echo "Waiting for application..."

          for i in {1..12}
          do
            if curl -fsS \
              http://localhost:8080/train-ticket-reservation/ \
              > /dev/null
            then
              echo "PRE-PROD deployment successful."
              exit 0
            fi

            echo "Waiting for application... $i/12"
            sleep 5
          done

          echo "PRE-PROD deployment failed."

          sudo systemctl status tomcat10 --no-pager || true

          exit 1

          EOF


  # ==========================================================
  # PRODUCTION
  # ==========================================================
  deploy-production:
    name: Deploy → PRODUCTION
    needs: deploy-preprod
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to PRODUCTION
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          SSHPASS: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e

          echo "========================================="
          echo "Deploying to PRODUCTION"
          echo "========================================="

          sshpass -e scp \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            artifact/train-ticket-reservation.war \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/train-ticket-reservation.war"

          echo "WAR copied successfully."

          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            'bash -s' <<'EOF'

          set -e

          echo "Stopping Tomcat..."

          sudo systemctl stop tomcat10

          echo "Removing old application..."

          sudo rm -rf /var/lib/tomcat10/webapps/train-ticket-reservation
          sudo rm -f /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Installing new WAR..."

          sudo cp \
            /tmp/train-ticket-reservation.war \
            /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Starting Tomcat..."

          sudo systemctl start tomcat10

          echo "Waiting for application..."

          for i in {1..12}
          do
            if curl -fsS \
              http://localhost:8080/train-ticket-reservation/ \
              > /dev/null
            then
              echo "PRODUCTION deployment successful."
              exit 0
            fi

            echo "Waiting for application... $i/12"
            sleep 5
          done

          echo "PRODUCTION deployment failed."

          sudo systemctl status tomcat10 --no-pager || true

          exit 1

          EOF
