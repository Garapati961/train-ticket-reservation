
name: Train Ticket Reservation - Multi Environment Deployment

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - pre-production
          - production

jobs:

  # ==========================================================
  # BUILD
  # ==========================================================
  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build application
        run: |
          mvn clean package -DskipTests

      - name: Find WAR file
        run: |
          echo "WAR files generated:"
          find target -name "*.war" -type f

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: target/*.war


  # ==========================================================
  # DEV
  # ==========================================================
  deploy-dev:
    name: Deploy to DEV
    needs: build
    if: |
      github.event_name == 'push' ||
      github.event.inputs.environment == 'dev'

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: deployment

      - name: Rename WAR
        run: |
          WAR_FILE=$(find deployment -name "*.war" | head -1)
          mv "$WAR_FILE" deployment/train-ticket-reservation.war

      - name: Deploy WAR to DEV Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}
        run: |
          set -e

          echo "========================================="
          echo "Deploying Train Ticket Reservation to DEV"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          curl -f -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deployment/train-ticket-reservation.war \
            "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/train-ticket-reservation&update=true"

          echo "DEV deployment completed successfully."


  # ==========================================================
  # TEST
  # ==========================================================
  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'test'

    runs-on: ubuntu-latest

    environment:
      name: test

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: deployment

      - name: Rename WAR
        run: |
          WAR_FILE=$(find deployment -name "*.war" | head -1)
          mv "$WAR_FILE" deployment/train-ticket-reservation.war

      - name: Deploy WAR to TEST Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}
        run: |
          set -e

          echo "========================================="
          echo "Deploying Train Ticket Reservation to TEST"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          curl -f -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deployment/train-ticket-reservation.war \
            "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/train-ticket-reservation&update=true"

          echo "TEST deployment completed successfully."


  # ==========================================================
  # PRE-PRODUCTION
  # ==========================================================
  deploy-pre-production:
    name: Deploy to PRE-PRODUCTION
    needs: deploy-test
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'pre-production'

    runs-on: ubuntu-latest

    environment:
      name: pre-production

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: deployment

      - name: Rename WAR
        run: |
          WAR_FILE=$(find deployment -name "*.war" | head -1)
          mv "$WAR_FILE" deployment/train-ticket-reservation.war

      - name: Deploy WAR to PRE-PRODUCTION Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}
        run: |
          set -e

          echo "========================================="
          echo "Deploying Train Ticket Reservation"
          echo "to PRE-PRODUCTION"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          curl -f -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deployment/train-ticket-reservation.war \
            "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/train-ticket-reservation&update=true"

          echo "PRE-PRODUCTION deployment completed successfully."


  # ==========================================================
  # PRODUCTION
  # ==========================================================
  deploy-production:
    name: Deploy to PRODUCTION
    needs: deploy-pre-production
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'production'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: deployment

      - name: Rename WAR
        run: |
          WAR_FILE=$(find deployment -name "*.war" | head -1)
          mv "$WAR_FILE" deployment/train-ticket-reservation.war

      - name: Deploy WAR to PRODUCTION Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}
        run: |
          set -e

          echo "========================================="
          echo "Deploying Train Ticket Reservation"
          echo "to PRODUCTION"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          curl -f -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deployment/train-ticket-reservation.war \
            "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/train-ticket-reservation&update=true"

          echo "PRODUCTION deployment completed successfully."
```
