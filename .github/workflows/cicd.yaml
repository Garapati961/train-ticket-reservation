
name: Train Ticket Reservation - Multi Environment

on:
  push:
    branches:
      - master
      - develop
      - qa

  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:

  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build Application
        run: |
          mvn clean package -DskipTests

      - name: Verify WAR
        run: |
          echo "Generated WAR files:"
          ls -lh target/*.war

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-reservation-war
          path: target/*.war


  # ============================================================
  # DEV
  # ============================================================

  deploy-dev:
    name: Deploy DEV
    needs: build

    if: |
      github.ref == 'refs/heads/develop' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.environment == 'dev'
      )

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-reservation-war

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to DEV Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

        run: |

          set -e

          echo "========================================="
          echo "Deploying to DEV"
          echo "========================================="

          WAR_FILE=$(find . -maxdepth 1 -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          echo "WAR file: $WAR_FILE"

          echo "Testing SSH connection..."

          sshpass -p "$TOMCAT_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            "echo SSH connection successful"

          echo "Copying WAR..."

          sshpass -p "$TOMCAT_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$WAR_FILE" \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/train-ticket-reservation.war"

          echo "Deploying WAR to Tomcat..."

          sshpass -p "$TOMCAT_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$TOMCAT_USER@$TOMCAT_HOST" << 'EOF'

            set -e

            sudo systemctl stop tomcat || true

            sudo rm -rf /opt/tomcat/webapps/train-ticket-reservation

            sudo rm -f /opt/tomcat/webapps/train-ticket-reservation.war

            sudo mv \
              /tmp/train-ticket-reservation.war \
              /opt/tomcat/webapps/train-ticket-reservation.war

            sudo chown tomcat:tomcat \
              /opt/tomcat/webapps/train-ticket-reservation.war

            sudo systemctl start tomcat

            sleep 10

            sudo systemctl status tomcat --no-pager

          EOF

          echo "DEV deployment completed successfully."


  # ============================================================
  # QA
  # ============================================================

  deploy-qa:
    name: Deploy QA
    needs: deploy-dev

    if: |
      github.ref == 'refs/heads/qa' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.environment == 'qa'
      )

    runs-on: ubuntu-latest

    environment:
      name: qa

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-reservation-war

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to QA Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

        run: |

          set -e

          echo "========================================="
          echo "Deploying to QA"
          echo "========================================="

          WAR_FILE=$(find . -maxdepth 1 -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          echo "Testing SSH connection..."

          sshpass -p "$TOMCAT_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            "echo SSH connection successful"

          echo "Copying WAR..."

          sshpass -p "$TOMCAT_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$WAR_FILE" \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/train-ticket-reservation.war"

          echo "Deploying WAR..."

          sshpass -p "$TOMCAT_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$TOMCAT_USER@$TOMCAT_HOST" << 'EOF'

            set -e

            sudo systemctl stop tomcat || true

            sudo rm -rf /opt/tomcat/webapps/train-ticket-reservation

            sudo rm -f /opt/tomcat/webapps/train-ticket-reservation.war

            sudo mv \
              /tmp/train-ticket-reservation.war \
              /opt/tomcat/webapps/train-ticket-reservation.war

            sudo chown tomcat:tomcat \
              /opt/tomcat/webapps/train-ticket-reservation.war

            sudo systemctl start tomcat

            sleep 10

            sudo systemctl status tomcat --no-pager

          EOF

          echo "QA deployment completed successfully."


  # ============================================================
  # PRODUCTION
  # ============================================================

  deploy-prod:
    name: Deploy PROD
    needs: deploy-qa

    if: |
      github.ref == 'refs/heads/master' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.environment == 'prod'
      )

    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-reservation-war

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to PROD Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

        run: |

          set -e

          echo "========================================="
          echo "Deploying to PROD"
          echo "========================================="

          WAR_FILE=$(find . -maxdepth 1 -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
