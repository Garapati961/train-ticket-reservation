name: ci/cd deploy to tomcat
'on':
  push:
    branches:
      - master
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v5
      - name: setup java@v5
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - name: validate code
        run: mvn validate
      - name: compile code
        run: mvn compile
      - name: test code
        run: mvn test
      - name: package maven
        run: mvn package
      - name: varify war filr
        run:  ls -lh target/
      - name: deploy war to tomcat
        run: |
              curl -v -u ${{secrets.TOMCAT_USER}}:${{secrets.TOMCAT_PASSWORD}} \
              -T target/TrainBook-1.0.0-SNAPSHOT.war \
              "http://${{secrets.TOMCAT_HOST}}:8080/manager/text/deploy?path=/TrainBookupdate=true"
      
