
name: Maven Build SonarQube Tomcat Deployment

on:
  push:
    branches:
      - main

jobs:
  build-sonar-deploy:

    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Maven Build
      - name: Maven Build
        run: mvn clean package

      # SonarQube Analysis
      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=my-maven-project \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # Deploy WAR file to Tomcat
      - name: Deploy to Tomcat
        run: |
          curl -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            --upload-file target/*.war \
            "${{ secrets.TOMCAT_URL }}/manager/text/deploy?path=/myapp&update=true"
