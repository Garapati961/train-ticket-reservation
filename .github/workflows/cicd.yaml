              echo "========================================="
              exit 0
            fi

            echo "Waiting for Tomcat... attempt $i/12"

            sleep 5
          done

          echo "PRE-PROD health check failed."

          echo "$SUDO_PASSWORD" | sudo -S systemctl status tomcat10 --no-pager || true

          exit 1

          EOF


  # ==========================================================
  # PRODUCTION
  # ==========================================================
  deploy-production:
    name: Deploy → PRODUCTION
    needs: deploy-preprod
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
