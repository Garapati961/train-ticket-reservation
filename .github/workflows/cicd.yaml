            exit 1
          fi

          echo "Testing SSH connection..."

          sshpass -p "$TOMCAT_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            "echo SSH connection successful"

          echo "Copying WAR..."

          sshpass -p "$TOMCAT_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$WAR_FILE" \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/train-ticket-reservation.war"

          echo "Deploying WAR..."

          sshpass -p "$TOMCAT_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$TOMCAT_USER@$TOMCAT_HOST" << 'EOF'

            set -e

            sudo systemctl stop tomcat || true

            sudo rm -rf /opt/tomcat/webapps/train-ticket-reservation

            sudo rm -f /opt/tomcat/webapps/train-ticket-reservation.war

            sudo mv \
              /tmp/train-ticket-reservation.war \
              /opt/tomcat/webapps/train-ticket-reservation.war

            sudo chown tomcat:tomcat \
              /opt/tomcat/webapps/train-ticket-reservation.war

            sudo systemctl start tomcat

            sleep 10

            sudo systemctl status tomcat --no-pager

          EOF

          echo "PROD deployment completed successfully."
