
name: Train Ticket Reservation CI/CD

on:
  push:
    branches:  
      -master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-analyze:
    name: Build and SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 17 runs the current Sonar scanner.
      # Maven still compiles to the Java version configured in pom.xml.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Find WAR artifact
        id: war
        shell: bash
        run: |
          set -euo pipefail
          WAR=$(find target -maxdepth 1 -type f -name '*.war' \
            ! -name 'original-*.war' | head -n 1)
          test -n "$WAR" || {
            echo "No WAR file found in target/"
            exit 1
          }
          echo "path=$WAR" >> "$GITHUB_OUTPUT"
          echo "Built artifact: $WAR"

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          test -n "$SONAR_TOKEN"
          test -n "$SONAR_HOST_URL"

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      - name: SonarQube Quality Gate
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Upload WAR for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: ${{ steps.war.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  publish-and-deploy:
    name: Publish to Nexus and Deploy to Tomcat
    needs: build-analyze
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download built WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: deployment-artifact

      - name: Locate WAR
        id: war
        shell: bash
        run: |
          set -euo pipefail
          WAR=$(find deployment-artifact -maxdepth 1 \
            -type f -name '*.war' | head -n 1)
          test -n "$WAR"
          echo "path=$WAR" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$WAR")" >> "$GITHUB_OUTPUT"

      - name: Publish WAR to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_URL"
          test -n "$NEXUS_USERNAME"
          test -n "$NEXUS_PASSWORD"

          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus-snapshots</id>
                <username>\${env.NEXUS_USERNAME}</username>
                <password>\${env.NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
          # Replace environment placeholders safely in settings.xml.
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path.home() / ".m2/settings.xml"
          s = p.read_text()
          s = s.replace("\${env.NEXUS_USERNAME}", os.environ["NEXUS_USERNAME"])
          s = s.replace("\${env.NEXUS_PASSWORD}", os.environ["NEXUS_PASSWORD"])
          p.write_text(s)
          PY

          mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Dfile="${{ steps.war.outputs.path }}" \
            -DpomFile=pom.xml \
            -DrepositoryId=nexus-snapshots \
            -Durl="${NEXUS_URL%/}/repository/maven-snapshots/"

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          WAR_FILE: ${{ steps.war.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$TOMCAT_URL"
          test -n "$TOMCAT_USER"
          test -n "$TOMCAT_PASSWORD"

          curl --fail --show-error --silent \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "${TOMCAT_URL%/}/manager/text/deploy?path=/TrainBook&update=true"

      - name: Deployment complete
        run: echo "WAR published to Nexus and deployed to Tomcat."
