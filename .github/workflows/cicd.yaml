
name: Train-Ticket-Reservation Multi-Environment CI/CD

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:

  # ==================================================
  # BUILD AND TEST
  # ==================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Prepare WAR
        run: |
          set -e
          WAR=$(find target -maxdepth 1 -type f -name '*.war' | head -n 1)
          test -n "$WAR"
          mkdir -p artifact
          cp "$WAR" artifact/train-ticket-reservation.war
          ls -lh artifact/train-ticket-reservation.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: artifact/train-ticket-reservation.war
          retention-days: 7

  # ==================================================
  # DEV
  # ==================================================
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to DEV
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSHPASS: ${{ secrets.EC2_PASSWORD }}
        run: |
          set -e

          echo "Deploying to DEV..."

          sshpass -e scp \
            -o StrictHostKeyChecking=yes \
            artifact/train-ticket-reservation.war \
            "$EC2_USER@$EC2_HOST:/tmp/train-ticket-reservation.war"

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'EOF'
          set -e

          sudo systemctl stop tomcat10

          sudo rm -rf /var/lib/tomcat10/webapps/train-ticket-reservation
          sudo rm -f /var/lib/tomcat10/webapps/train-ticket-reservation.war

          sudo cp /tmp/train-ticket-reservation.war \
            /var/lib/tomcat10/webapps/train-ticket-reservation.war

          sudo systemctl start tomcat10

          for i in {1..12}; do
            if curl -fsS http://localhost:8080/train-ticket-reservation/ > /dev/null; then
              echo "DEV deployment successful"
              exit 0
            fi
            sleep 5
          done

          sudo systemctl status tomcat10 --no-pager || true
          exit 1
          EOF

  # ==================================================
  # TEST
  # ==================================================
  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: test

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to TEST
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSHPASS: ${{ secrets.EC2_PASSWORD }}
        run: |
          set -e

          echo "Deploying to TEST..."

          sshpass -e scp \
            -o StrictHostKeyChecking=yes \
            artifact/train-ticket-reservation.war \
            "$EC2_USER@$EC2_HOST:/tmp/train-ticket-reservation.war"

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'EOF'
          set -e

          sudo systemctl stop tomcat10

          sudo rm -rf /var/lib/tomcat10/webapps/train-ticket-reservation
          sudo rm -f /var/lib/tomcat10/webapps/train-ticket-reservation.war

          sudo cp /tmp/train-ticket-reservation.war \
            /var/lib/tomcat10/webapps/train-ticket-reservation.war

          sudo systemctl start tomcat10

          for i in {1..12}; do
            if curl -fsS http://localhost:8080/train-ticket-reservation/ > /dev/null; then
              echo "TEST deployment successful"
              exit 0
            fi
            sleep 5
          done

          sudo systemctl status tomcat10 --no-pager || true
          exit 1
          EOF

  # ==================================================
  # PRE-PRODUCTION
  # ==================================================
  deploy-preprod:
    name: Deploy to PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest

    environment:
      name: pre-production

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to PRE-PROD
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSHPASS: ${{ secrets.EC2_PASSWORD }}
        run: |
          set -e

          echo "Deploying to PRE-PROD..."

          sshpass -e scp \
            -o StrictHostKeyChecking=yes \
            artifact/train-ticket-reservation.war \
