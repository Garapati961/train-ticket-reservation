name: Build and Deploy Train Ticket Reservation

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Check WAR File
        run: |
          echo "WAR files:"
          ls -lh target/*.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: target/*.war


  # =========================
  # DEPLOY
  # =========================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Check WAR File
        run: |
          echo "Downloaded WAR:"
          ls -lh artifact/*.war

      - name: Deploy to Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

        run: |

          set -e

          WAR_FILE=$(find ./artifact -name "*.war" -type f | head -n 1)

          echo "WAR file found:"
          echo "$WAR_FILE"

          echo "Deploying to Tomcat..."

          curl --fail --show-error --silent \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-reservation&update=true"

          echo "Deployment successful!"
