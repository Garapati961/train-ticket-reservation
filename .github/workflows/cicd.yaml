
name: Train Ticket Reservation - Multi Environment CI/CD

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check Java version
        run: |
          java -version
          mvn -version

      - name: Build WAR
        run: |
          set -e

          echo "========================================="
          echo "Building Train Ticket Reservation"
          echo "========================================="

          mvn clean package -DskipTests

      - name: Find WAR file
        run: |
          echo "Generated WAR files:"
          find target -type f -name "*.war"

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-reservation-war
          path: target/*.war


  # ============================================================
  # DEV
  # ============================================================
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-reservation-war
          path: deployment

      - name: Prepare WAR
        run: |
          set -e

          WAR_FILE=$(find deployment -type f -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          mv "$WAR_FILE" deployment/train-ticket-reservation.war

          echo "WAR file prepared:"
          ls -lh deployment/train-ticket-reservation.war

      - name: Test DEV Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}

        run: |
          set -e

          echo "========================================="
          echo "Testing DEV Tomcat"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          HTTP_CODE=$(curl -s \
            -o /tmp/tomcat_response.txt \
            -w "%{http_code}" \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            "http://$TOMCAT_HOST:8080/manager/text/list")

          echo "Tomcat HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: DEV Tomcat authentication failed"
            cat /tmp/tomcat_response.txt
            exit 1
          fi

          echo "DEV Tomcat authentication successful."

      - name: Deploy to DEV Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}

        run: |
          set -e

          echo "========================================="
          echo "Deploying Train Ticket Reservation to DEV"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file deployment/train-ticket-reservation.war \
            "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/train-ticket-reservation&update=true"

          echo ""
          echo "========================================="
          echo "DEV Deployment Successful"
          echo "========================================="


  # ============================================================
  # TEST
  # ============================================================
  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: test

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-reservation-war
          path: deployment

      - name: Prepare WAR
        run: |
          set -e

          WAR_FILE=$(find deployment -type f -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          mv "$WAR_FILE" deployment/train-ticket-reservation.war

      - name: Test TEST Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}

        run: |
          set -e

          echo "========================================="
          echo "Testing TEST Tomcat"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          HTTP_CODE=$(curl -s \
            -o /tmp/tomcat_response.txt \
            -w "%{http_code}" \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            "http://$TOMCAT_HOST:8080/manager/text/list")

          echo "Tomcat HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: TEST Tomcat authentication failed"
            cat /tmp/tomcat_response.txt
            exit 1
          fi

          echo "TEST Tomcat authentication successful."

      - name: Deploy to TEST Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}

        run: |
          set -e

          echo "========================================="
          echo "Deploying Train Ticket Reservation to TEST"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file deployment/train-ticket-reservation.war \
            "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/train-ticket-reservation&update=true"

          echo ""
          echo "========================================="
          echo "TEST Deployment Successful"
          echo "========================================="


  # ============================================================
  # PRE-PRODUCTION
  # ============================================================
  deploy-pre-production:
    name: Deploy to PRE-PRODUCTION
    needs: deploy-test
    runs-on: ubuntu-latest

    environment:
      name: pre-production

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-reservation-war
          path: deployment

      - name: Prepare WAR
        run: |
          set -e

          WAR_FILE=$(find deployment -type f -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          mv "$WAR_FILE" deployment/train-ticket-reservation.war

      - name: Test PRE-PRODUCTION Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}

        run: |
          set -e

          echo "========================================="
          echo "Testing PRE-PRODUCTION Tomcat"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          HTTP_CODE=$(curl -s \
            -o /tmp/tomcat_response.txt \
            -w "%{http_code}" \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            "http://$TOMCAT_HOST:8080/manager/text/list")

          echo "Tomcat HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: PRE-PRODUCTION Tomcat authentication failed"
            cat /tmp/tomcat_response.txt
            exit 1
          fi

          echo "PRE-PRODUCTION Tomcat authentication successful."

      - name: Deploy to PRE-PRODUCTION Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}

        run: |
          set -e

          echo "========================================="
          echo "Deploying Train Ticket Reservation"
          echo "to PRE-PRODUCTION"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file deployment/train-ticket-reservation.war \
            "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/train-ticket-reservation&update=true"

          echo ""
          echo "========================================="
          echo "PRE-PRODUCTION Deployment Successful"
          echo "========================================="


  # ============================================================
  # PRODUCTION
  # ============================================================
  deploy-production:
    name: Deploy to PRODUCTION
    needs: deploy-pre-production
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-reservation-war
          path: deployment

      - name: Prepare WAR
        run: |
          set -e

          WAR_FILE=$(find deployment -type f -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          mv "$WAR_FILE" deployment/train-ticket-reservation.war

      - name: Test PRODUCTION Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}

        run: |
          set -e

          echo "========================================="
          echo "Testing PRODUCTION Tomcat"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          HTTP_CODE=$(curl -s \
            -o /tmp/tomcat_response.txt \
            -w "%{http_code}" \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            "http://$TOMCAT_HOST:8080/manager/text/list")

          echo "Tomcat HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: PRODUCTION Tomcat authentication failed"
            cat /tmp/tomcat_response.txt
            exit 1
          fi

          echo "PRODUCTION Tomcat authentication successful."

      - name: Deploy to PRODUCTION Tomcat
        env:
          TOMCAT_USER: ${{ secrets.tomcat_user }}
          TOMCAT_PASSWORD: ${{ secrets.tomcat_password }}
          TOMCAT_HOST: ${{ secrets.tomcat_host }}

        run: |
          set -e

          echo "========================================="
          echo "Deploying Train Ticket Reservation"
          echo "to PRODUCTION"
          echo "========================================="

          echo "Tomcat Host: $TOMCAT_HOST"

          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file deployment/train-ticket-reservation.war \
            "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/train-ticket-reservation&update=true"

          echo ""
          echo "========================================="
          echo "PRODUCTION Deployment Successful"
          echo "========================================="
