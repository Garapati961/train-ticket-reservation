            "$EC2_USER@$EC2_HOST" 'bash -s' <<'EOF'
          set -e

          sudo systemctl stop tomcat10

          sudo rm -rf /var/lib/tomcat10/webapps/train-ticket-reservation
          sudo rm -f /var/lib/tomcat10/webapps/train-ticket-reservation.war

          sudo cp /tmp/train-ticket-reservation.war \
            /var/lib/tomcat10/webapps/train-ticket-reservation.war

          sudo systemctl start tomcat10

          for i in {1..12}; do
            if curl -fsS http://localhost:8080/train-ticket-reservation/ > /dev/null; then
              echo "PRE-PROD deployment successful"
              exit 0
            fi
            sleep 5
          done

          sudo systemctl status tomcat10 --no-pager || true
          exit 1
          EOF

  # ==================================================
  # PRODUCTION
  # ==================================================
  deploy-production:
    name: Deploy to PRODUCTION
    needs: deploy-preprod
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to PRODUCTION
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
