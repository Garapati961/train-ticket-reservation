name: Train-Ticket-Reservation Multi-Environment CI/CD

on:
  push:
    branches:
      - master
permissions:
  contents: read

jobs:

  # ==========================================================
  # BUILD AND TEST
  # ==========================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: |
          mvn -B clean package

      - name: Find and Prepare WAR
        run: |
          set -e

          echo "Checking generated WAR..."

          WAR=$(find target -maxdepth 1 -type f -name "*.war" | head -n 1)

          if [ -z "$WAR" ]; then
            echo "ERROR: WAR file not found!"
            ls -la target/
            exit 1
          fi

          echo "WAR found: $WAR"

          mkdir -p artifact

          cp "$WAR" artifact/train-ticket-reservation.war

          echo "Prepared WAR:"
          ls -lh artifact/train-ticket-reservation.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: artifact/train-ticket-reservation.war
          retention-days: 7


  # ==========================================================
  # DEV
  # ==========================================================
  deploy-dev:
    name: Deploy → DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: artifact

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to DEV
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSHPASS: ${{ secrets.EC2_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Deploying Train Ticket Reservation to DEV"
          echo "========================================="

          echo "Copying WAR to EC2..."

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            artifact/train-ticket-reservation.war \
            "$EC2_USER@$EC2_HOST:/tmp/train-ticket-reservation.war"

          echo "WAR copied successfully."

          echo "Connecting to EC2..."

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "$EC2_USER@$EC2_HOST" \
            "SUDO_PASSWORD='$SSHPASS' bash -s" <<'EOF'

          set -e

          echo "Stopping Tomcat..."

          echo "$SUDO_PASSWORD" | sudo -S systemctl stop tomcat10

          echo "Removing old deployment..."

          echo "$SUDO_PASSWORD" | sudo -S rm -rf \
            /var/lib/tomcat10/webapps/train-ticket-reservation

          echo "$SUDO_PASSWORD" | sudo -S rm -f \
            /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Installing new WAR..."

          echo "$SUDO_PASSWORD" | sudo -S cp \
            /tmp/train-ticket-reservation.war \
            /var/lib/tomcat10/webapps/train-ticket-reservation.war

          echo "Starting Tomcat..."

          echo "$SUDO_PASSWORD" | sudo -S systemctl start tomcat10

          echo "Waiting for application..."

          for i in {1..12}
          do
            if curl -fsS \
              http://localhost:8080/train-ticket-reservation/ \
              > /dev/null
            then
              echo "========================================="
              echo "DEV deployment successful"
              echo "========================================="
              exit 0
            fi

            echo "Waiting for Tomcat... attempt $i/12"

            sleep 5
          done

          echo "DEV health check failed."

          echo "$SUDO_PASSWORD" | sudo -S systemctl status tomcat10 --no-pager || true

          exit 1

          EOF


  # ==========================================================
  # TEST
  # ==========================================================
  deploy-test:
    name: Deploy → TEST
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: test

    steps:

      - name: Download WAR
